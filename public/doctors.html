<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ডাক্তার খুঁজুন</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w"><h2>🩺 বিশেষজ্ঞ ডাক্তার</h2><input id="s" placeholder="নাম বা বিভাগ খুঁজুন…"><div class="chips" id="ch"></div><div class="g" id="l"></div></main>
<dialog id="d"><h3 id="dn" style="margin-top:0"></h3><p class="mu">স্লট বেছে নিন</p><div class="chips" id="sl"></div><div class="row"><button class="btn o" onclick="d.close()">বাতিল</button><button class="btn" id="ok" style="flex:1">নিশ্চিত করুন</button></div></dialog>
<script src="js/app.js"></script><script>
let F=new URLSearchParams(location.search).get('s')||'All',cur,slot;const d=$('#d');
const SP=['All',...new Set(DOCS.map(x=>x.sp))];
function draw(){$('#ch').innerHTML='';SP.forEach(s=>{const b=document.createElement('button');b.className='chip'+(s==F?' on':'');b.textContent=s;b.onclick=()=>{F=s;draw()};$('#ch').append(b)});
 const q=$('#s').value.toLowerCase();$('#l').innerHTML='';DOCS.filter(x=>(F=='All'||x.sp==F)&&(x.n+x.sp+x.bn).toLowerCase().includes(q)).forEach(x=>{const e=document.createElement('div');e.className='card';
 e.innerHTML=`<div class="row" style="align-items:center"><div class="av">${x.n[3]}</div><div><b>${x.n}</b><br><span class="mu">${x.sp} · ${x.ex} বছর</span></div></div><p>⭐ ${x.rt} · <b>৳${x.fee}</b> <span class="ok">● অনলাইন</span></p>`;
 const b=document.createElement('button');b.className='btn';b.style.width='100%';b.textContent='অ্যাপয়েন্টমেন্ট নিন';b.onclick=()=>{cur=x;slot=null;$('#dn').textContent=x.n;$('#sl').innerHTML='';['আজ ৮:০০ PM','আজ ৯:০০ PM','কাল ১০:০০ AM','কাল ৫:০০ PM'].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>{slot=t;[...$('#sl').children].forEach(k=>k.classList.toggle('on',k==c))};$('#sl').append(c)});d.showModal()};e.append(b);$('#l').append(e)})}
$('#ok').onclick=()=>{if(!slot)return toast('একটি স্লট বেছে নিন');const i=book(cur,slot);location.href='payment.html?a='+i};$('#s').oninput=draw;draw()</script></body></html>
