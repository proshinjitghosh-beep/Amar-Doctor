<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>প্রোফাইল</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:640px"><h2>👤 আমার প্রোফাইল</h2><div class="card"><form id="f" style="display:grid;gap:12px"><input id="n" placeholder="নাম *" required><div class="row"><input id="a" type="number" placeholder="বয়স *" required><select id="g"><option>পুরুষ</option><option>নারী</option><option>অন্যান্য</option></select></div><div class="row"><input id="h" type="number" placeholder="উচ্চতা (cm)"><input id="w" type="number" placeholder="ওজন (kg)"></div><select id="bg"><option value="">রক্তের গ্রুপ</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select><input id="al" placeholder="ওষুধে অ্যালার্জি"><input id="cd" placeholder="দীর্ঘমেয়াদি রোগ (যেমন ডায়াবেটিস)"><button class="btn">সংরক্ষণ করুন</button></form><button class="btn o" id="out" style="width:100%;margin-top:10px">লগআউট</button></div>
</main><script src="js/app.js"></script><script>
const U=LS.g('user',{}),ids=['n','a','g','h','w','bg','al','cd'];ids.forEach(i=>U[i]&&($('#'+i).value=U[i]));
$('#f').onsubmit=e=>{e.preventDefault();const u={...U};ids.forEach(i=>u[i]=$('#'+i).value);u.name=u.n;LS.s('user',u);toast('✅ প্রোফাইল সংরক্ষিত');setTimeout(()=>location='dashboard.html',900)};
$('#out').onclick=()=>{localStorage.removeItem('user');location='login.html'}</script></body></html>
