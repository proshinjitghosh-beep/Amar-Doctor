<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI ডাক্তার</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:720px"><h2>💬 AI ডাক্তার</h2><div class="card"><div class="chat" id="c"><div class="b ai">আসসালামু আলাইকুম! কী সমস্যা হচ্ছে বলুন। আমি আগে জরুরি লক্ষণ দেখে নেব।</div></div>
<div class="chips" id="q"></div><form class="row" id="f"><input id="t" placeholder="যেমন: দুইদিন ধরে জ্বর ও গলাব্যথা…" autocomplete="off"><button class="btn">পাঠান</button></form></div></main><script src="js/app.js"></script><script>
const c=$('#c'),HS=[];['মাথাব্যথা ও ঘুম হচ্ছে না','বুকে ব্যথা','ত্বকে র‍্যাশ','বাচ্চার জ্বর'].forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>send(s);$('#q').append(b)});
function add(h,k){const d=document.createElement('div');d.className='b '+k;d.innerHTML=h;c.append(d);c.scrollTop=1e6;return d}
async function send(x){if(!x.trim())return;$('#t').value='';add(x.replace(/</g,'&lt;'),'me');const d=add('<span class="dots"><span></span><span></span><span></span></span>','ai');const r=await triage(x,HS);HS.push({role:'user',content:x},{role:'assistant',content:r.reply});d.className='b '+(r.em?'em':'ai');d.textContent=r.reply;
 if(r.sp){const a=document.createElement('a');a.className='btn';a.style.margin='10px 0 0';a.style.display='block';a.textContent='📅 '+r.sp+' ডাক্তার বুক করুন';a.href='doctors.html?s='+r.sp;d.append(a)}
 const h=LS.g('hist',[]);h.push({x,t:Date.now()});LS.s('hist',h)}
$('#f').onsubmit=e=>{e.preventDefault();send($('#t').value)}</script></body></html>
