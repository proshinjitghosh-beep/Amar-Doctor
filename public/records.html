<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>মেডিকেল রেকর্ড</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:760px"><h2>🗂️ মেডিকেল রেকর্ড</h2><div class="chips"><button class="chip on" data-t="rx">💊 প্রেসক্রিপশন</button><button class="chip" data-t="lab">🧪 ল্যাব রিপোর্ট</button></div><div id="c"></div>
</main><script src="js/app.js"></script><script>
const V={rx:()=>{const r=LS.g('rx',[]);return r.length?r.slice().reverse().map(x=>`<div class="card" style="margin-bottom:12px"><b>${x.doc}</b> <span class="tag">${new Date(x.t).toLocaleDateString('bn-BD')}</span><p>রোগী: ${x.pt}</p><p>💊 <b>${x.med}</b></p><p class="mu">${x.note||''}</p><button class="chip" onclick="print()">🖨️ প্রিন্ট</button></div>`).join(''):'<p class="mu">কোনো প্রেসক্রিপশন নেই। ডাক্তার প্যানেল থেকে একটি দিন।</p>'},
lab:()=>[['CBC (রক্ত পরীক্ষা)','১২ অক্টোবর','স্বাভাবিক'],['ব্লাড সুগার (ফাস্টিং)','৩ নভেম্বর','5.4 mmol/L · স্বাভাবিক'],['লিপিড প্রোফাইল','৩ নভেম্বর','LDL সামান্য বেশি']].map(x=>`<div class="card" style="margin-bottom:12px"><b>${x[0]}</b> <span class="tag">${x[1]}</span><p class="ok">${x[2]}</p></div>`).join('')+'<label class="btn o" style="display:block;text-align:center">⬆️ রিপোর্ট আপলোড (ডেমো)<input type="file" hidden onchange="toast(\'✅ \'+this.files[0].name)"></label>'};
const show=k=>{$('#c').innerHTML=V[k]();document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==k))};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));show('rx')</script></body></html>
