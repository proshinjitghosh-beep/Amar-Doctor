<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ড্যাশবোর্ড</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w"><h2 id="hi0">📋 আমার ড্যাশবোর্ড</h2><div class="g"><div class="card"><b>আসন্ন অ্যাপয়েন্টমেন্ট</b><div id="a" style="margin-top:10px"></div></div>
<div class="card"><b>⚖️ BMI ক্যালকুলেটর</b><div class="row" style="margin:10px 0"><input id="h" type="number" placeholder="উচ্চতা cm"><input id="w" type="number" placeholder="ওজন kg"></div><button class="btn" id="bm">হিসাব করুন</button><p id="br" class="ok"></p></div>
<div class="card"><b>🧠 AI কনসাল্ট ইতিহাস</b><div id="hi" class="mu" style="margin-top:10px"></div></div></div></main><script src="js/app.js"></script><script>
if(U0&&U0.name)$('#hi0').textContent='👋 '+U0.name+', আপনার ড্যাশবোর্ড';const A=LS.g('appts',[]);$('#a').innerHTML=A.length?'':'<span class="mu">কোনো অ্যাপয়েন্টমেন্ট নেই। <a href="doctors.html" class="hl">বুক করুন →</a></span>';
A.forEach(x=>{const e=document.createElement('div');e.style.cssText='padding:8px 0;border-top:1px solid var(--ln)';e.innerHTML=`<b>${x.doc}</b><br><span class="mu">${x.sp} · ${x.slot}</span> `;e.insertAdjacentHTML('beforeend',x.paid?'<span class="ok">✓ পেইড</span> <a class="chip" href="records.html">💊 প্রেসক্রিপশন</a>':'<a class="chip on" href="payment.html?a='+x.id+'">💳 পেমেন্ট করুন</a>');$('#a').append(e)});
const H=LS.g('hist',[]);$('#hi').innerHTML=H.length?H.slice(-5).reverse().map(x=>'• '+x.x.replace(/</g,'&lt;')).join('<br>'):'এখনো কিছু নেই';
$('#bm').onclick=()=>{const m=$('#h').value/100,b=$('#w').value/(m*m);if(!(b>0&&b<80))return toast('সঠিক সংখ্যা দিন');$('#br').textContent=`BMI ${b.toFixed(1)}: `+(b<18.5?'কম ওজন':b<23?'স্বাভাবিক':b<27.5?'অতিরিক্ত ওজন':'স্থূলতা')+' (এশিয়ান মান)'}</script></body></html>
