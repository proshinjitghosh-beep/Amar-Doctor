<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>মেডিকেল রেকর্ড</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:760px"><h2>🗂️ মেডিকেল রেকর্ড</h2><div class="chips"><button class="chip on" data-t="rx">💊 প্রেসক্রিপশন</button><button class="chip" data-t="lab">🧪 ল্যাব রিপোর্ট</button></div><div id="c"></div>
</main><script src="js/app.js"></script><script src="js/health.js"></script><script>
const {esc,api,bnDate,loading,empty,errorNote}=H;

/*
 * Two kinds of record live here.
 *
 * The prescriptions are the demo doctor's own notes - they are stored in the
 * browser by the doctor panel, so they are labelled as demo data.
 *
 * The lab results are the real ones: they are read from the reports the
 * patient uploaded. Nothing is invented, and a report with no values says so.
 */
function renderRx(){
  const list=LS.g('rx',[]);
  if(!list.length)return empty('কোনো প্রেসক্রিপশন নেই','ডাক্তার প্যানেল থেকে একটি দিন','💊');
  return `<div class="note" style="margin-bottom:12px"><b>ডেমো প্রেসক্রিপশন</b>এগুলো ডাক্তার প্যানেলের ডেমো ডাক্তারের লেখা নোট, ব্রাউজারেই সংরক্ষিত। আপনার নিজের ওষুধের তালিকা <b>ওষুধ</b> পাতায় আছে।</div>`+
    list.slice().reverse().map(x=>`<div class="card" style="margin-bottom:12px"><b>${esc(x.doc)}</b> <span class="tag">${esc(new Date(x.t).toLocaleDateString('bn-BD'))}</span><p>রোগী: ${esc(x.pt)}</p><p>💊 <b>${esc(x.med)}</b></p><p class="mu">${esc(x.note||'')}</p><button class="chip" data-print>🖨️ প্রিন্ট</button></div>`).join('');
}

async function renderLab(){
  const box=$('#c');
  box.innerHTML=loading('রিপোর্ট লোড হচ্ছে…');
  try{
    const data=await api('GET','/api/reports');
    const reports=data.reports||[];
    if(!reports.length){
      box.innerHTML=empty('কোনো ল্যাব রিপোর্ট নেই','রিপোর্ট আপলোড করলে এখানে দেখা যাবে','🧪')+
        '<a class="btn o" style="display:block;text-align:center" href="reports.html">রিপোর্ট আপলোড করে বিশ্লেষণ করুন</a>';
      return;
    }
    const cards=await Promise.all(reports.map(async r=>{
      const detail=await api('GET','/api/reports/'+r.id).catch(()=>null);
      const rows=(detail&&detail.results)||[];
      const body=rows.length
        ?`<div class="lab">${rows.map(x=>{
            const cls=x.status==='normal'?'ok':(x.status==='unknown'?'none':(x.status==='above_reference'?'high':'low'));
            const bn={normal:'স্বাভাবিক',below_reference:'রেঞ্জের নিচে',above_reference:'রেঞ্জের উপরে',critical_high:'অত্যন্ত উচ্চ',critical_low:'অত্যন্ত নিম্ন',unknown:'অজানা'}[x.status]||'অজানা';
            return `<div class="lab-r"><div class="t">${esc(x.testName)}${x.source==='manual'?' <span class="pill o">নিজে লেখা</span>':''}</div>
              <div class="v ${cls}">${esc(x.resultValue||'—')}<span class="u">${esc(x.unit||'')}</span></div>
              <div class="rg">${x.referenceRange?'রেঞ্জ '+esc(x.referenceRange):'রিপোর্টে রেঞ্জ দেওয়া নেই'} · ${esc(bn)}</div></div>`;
          }).join('')}</div>`
        :'<p class="mu">এই রিপোর্টে কোনো মান পড়া যায়নি।</p>';
      return `<div class="card" style="margin-bottom:12px"><b>${esc(r.fileName)}</b> <span class="tag">${esc(bnDate(r.createdAt))}</span>${body}
        <button class="chip" data-open-report="${r.id}" style="margin-top:8px">📄 রিপোর্ট খুলুন</button></div>`;
    }));
    box.innerHTML=cards.join('')+'<a class="btn o" style="display:block;text-align:center;margin-top:9px" href="doctor-prep.html">ভিজিট প্রস্তুতি করুন</a>';
    box.querySelectorAll('[data-open-report]').forEach(b=>b.onclick=()=>{location.href='reports.html'});
  }catch(error){
    // Signed out, or the database is not configured. Say so plainly.
    box.innerHTML=errorNote(error.message)+
      '<a class="btn o" style="display:block;text-align:center;margin-top:9px" href="reports.html">রিপোর্ট পাতায় যান</a>';
  }
}

const show=k=>{
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  if(k==='rx'){$('#c').innerHTML=renderRx();bindPrint();return}
  renderLab();
};

function bindPrint(){
  document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>window.print());
}

document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));
show('rx');
</script></body></html>
