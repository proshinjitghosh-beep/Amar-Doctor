<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ডাক্তার প্যানেল</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:900px"><h2>🧑‍⚕️ ডাক্তার প্যানেল <span class="tag">ডেমো</span></h2><div class="g"><div class="card"><div class="big" id="k1"></div>আজকের রোগী</div><div class="card"><div class="big" id="k2"></div>আনুমানিক আয়</div><div class="card"><div class="big">4.9</div>রেটিং</div></div><h2 style="font-size:22px">রোগীর সারি</h2><div id="q" class="g"></div>
<dialog id="d"><h3 id="dn" style="margin-top:0"></h3><p class="mu" id="ds"></p><div class="card" style="padding:10px;margin-bottom:10px;font-size:14px">🤖 <b>AI সারাংশ:</b> <span id="ai"></span></div><input id="md" placeholder="ওষুধ ও ডোজ (যেমন: Napa 500mg, দিনে ৩ বার)"><textarea id="nt" rows="3" placeholder="পরামর্শ ও ফলো-আপ" style="margin-top:8px"></textarea><div class="row" style="margin-top:10px"><button class="btn o" onclick="d.close()">বাতিল</button><button class="btn" id="sv" style="flex:1">প্রেসক্রিপশন দিন</button></div></dialog>
</main><script src="js/app.js"></script><script>
const d=$('#d'),mine=LS.g('appts',[]).filter(x=>x.paid).map(x=>({id:x.id,n:LS.g('user',{}).name||'আপনি (ডেমো)',age:LS.g('user',{}).a||'-',sx:'পেমেন্ট সম্পন্ন অ্যাপয়েন্টমেন্ট',slot:x.slot,fee:x.fee,doc:x.doc})),
P=[...mine,{id:'p1',n:'রাহিম উদ্দিন',age:34,sx:'৩ দিন ধরে জ্বর ও গলাব্যথা',slot:'আজ ৮:০০ PM',fee:500},{id:'p2',n:'সুমাইয়া আক্তার',age:27,sx:'মাথাব্যথা ও ঘুমের সমস্যা',slot:'আজ ৯:০০ PM',fee:500}],R=LS.g('rx',[]);let cur;
$('#k1').textContent=P.length;$('#k2').textContent='৳'+Math.round(P.reduce((s,x)=>s+x.fee,0)*.85);
P.forEach(x=>{const e=document.createElement('div');e.className='card';const done=R.some(r=>r.aid==x.id);e.innerHTML=`<b>${x.n}</b> <span class="mu">· ${x.age} বছর</span><br><span class="mu">${x.sx}</span><br><span class="tag">${x.slot}</span> ${done?'<span class="ok">✓ সম্পন্ন</span>':''}`;
const b=document.createElement('button');b.className='btn';b.style.cssText='width:100%;margin-top:10px';b.textContent='দেখুন ও প্রেসক্রিপশন';b.onclick=()=>{cur=x;$('#dn').textContent=x.n;$('#ds').textContent=x.sx;$('#ai').textContent='রোগী '+x.sx+' জানিয়েছেন। জরুরি লক্ষণ নেই। প্রাথমিক পরামর্শ: বিশ্রাম ও পানি।';d.showModal()};e.append(b);$('#q').append(e)});
$('#sv').onclick=()=>{if(!$('#md').value)return toast('ওষুধ লিখুন');R.push({aid:cur.id,doc:cur.doc||'ডা. তানভীর আহমেদ',pt:cur.n,med:$('#md').value,note:$('#nt').value,t:Date.now()});LS.s('rx',R);d.close();toast('✅ প্রেসক্রিপশন পাঠানো হয়েছে');setTimeout(()=>location.reload(),900)}</script></body></html>
