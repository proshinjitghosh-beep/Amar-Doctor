<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>লগইন</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:440px"><div class="card" style="margin-top:40px;text-align:center"><div class="av" style="margin:0 auto 10px">✚</div><h2 style="margin:0">স্বাগতম</h2><p class="mu">আপনার অ্যাকাউন্টে ঢুকুন</p>
<p class="mu" style="font-size:13.5px">রিপোর্ট, ওষুধ ও ভিজিট প্রস্তুতি আপনার নিজের অ্যাকাউন্টে থাকে, তাই এখানে সাইন ইন বা অ্যাকাউন্ট খুলতে হবে।</p>
<div id="panel" style="text-align:left"></div>
<div class="note" style="margin-top:14px;text-align:left"><b>ডেমো অ্যাকাউন্ট</b> ডেমো মোডে একটি অ্যাকাউন্ট ও নমুনা রেকর্ড তৈরি করা যায়; তার লগইন তথ্য টার্মিনালে দেখানো হয়।</div>
</div></main><script src="js/app.js"></script><script src="js/health.js"></script><script>
const {gate}=H;

/*
 * The sign-in panel is the same one the healthcare modules use, so the
 * identity a visitor gets here is a real server session, not a name in the
 * browser's local storage.
 */
gate($('#panel'),{
  title:'অ্যাকাউন্ট',
  hint:'অ্যাকাউন্ট খুললে আপনার রিপোর্ট ও ওষুধ সংরক্ষিত থাকবে। ইমেইল ও পাসওয়ার্ড দিয়ে সাইন ইন করতে পারেন।',
  onSignedIn:()=>{location.href='dashboard.html'}
});

/* Someone who is already signed in has nothing to do on this page. */
H.ready(async()=>{
  if(H.isSignedIn())location.href='dashboard.html';
});
</script></body></html>
