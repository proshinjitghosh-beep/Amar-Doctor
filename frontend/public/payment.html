<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>পেমেন্ট</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><main class="w" style="max-width:480px"><h2>💳 পেমেন্ট</h2><div class="card"><div id="sm"></div><div class="chips" id="mt"></div><input id="no" placeholder="একাউন্ট নম্বর" inputmode="numeric"><input id="pn" type="password" placeholder="PIN (ডেমো: যেকোনো)" style="margin-top:10px"><button class="btn" id="pay" style="width:100%;margin-top:12px"></button><p class="mu" style="font-size:13px">🔒 ডেমো পেমেন্ট। আসল টাকা কাটা হয় না।</p></div><div class="card ok" id="done" style="display:none;margin-top:14px;text-align:center"><div class="big" style="color:var(--g)">✓</div><b>পেমেন্ট সফল!</b><p id="tx" class="mu"></p><a class="btn" href="dashboard.html">ড্যাশবোর্ডে যান</a></div>
</main><script src="js/app.js"></script><script>
const A=LS.g('appts',[]),id=new URLSearchParams(location.search).get('a'),ap=A.find(x=>x.id==id)||A[A.length-1];let m='bKash';
if(!ap){$('.card').innerHTML='কোনো অ্যাপয়েন্টমেন্ট নেই।'}else{const fee=ap.fee,sv=Math.round(fee*.05),tot=fee+sv;
$('#sm').innerHTML=`<b>${ap.doc}</b><br><span class="mu">${ap.sp} · ${ap.slot}</span><hr style="border:0;border-top:1px solid var(--ln)"><div class="row" style="justify-content:space-between"><span>কনসাল্ট ফি</span><span>৳${fee}</span></div><div class="row" style="justify-content:space-between"><span>সার্ভিস চার্জ</span><span>৳${sv}</span></div><div class="row" style="justify-content:space-between"><b>মোট</b><b>৳${tot}</b></div>`;
$('#pay').textContent='৳'+tot+' পেমেন্ট করুন';['bKash','Nagad','Rocket','Card'].forEach(k=>{const b=document.createElement('button');b.className='chip'+(k==m?' on':'');b.textContent=k;b.onclick=()=>{m=k;[...$('#mt').children].forEach(c=>c.classList.toggle('on',c==b))};$('#mt').append(b)});
$('#pay').onclick=()=>{if($('#no').value.length<8)return toast('একাউন্ট নম্বর দিন');$('#pay').textContent='প্রসেসিং…';$('#pay').disabled=true;setTimeout(()=>{ap.paid=1;ap.tx='TX'+Date.now().toString(36).toUpperCase();ap.m=m;LS.s('appts',A);$('.card').style.display='none';$('#done').style.display='block';$('#tx').textContent=m+' · ট্রানজেকশন '+ap.tx},1300)}}</script></body></html>
