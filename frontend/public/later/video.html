<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ভিডিও কনসাল্ট</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>.vd{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:16/10}.vd video{width:100%;height:100%;object-fit:cover}#me{position:absolute;right:12px;bottom:12px;width:28%;height:auto;border-radius:12px;border:2px solid #fff;transform:scaleX(-1)}#w{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;animation:bl 1.6s infinite}</style></head><body><main class="w" style="max-width:760px"><h2>📹 ভিডিও কনসাল্ট</h2>
<div class="vd"><video id="you" autoplay playsinline></video><div id="w">অপর পক্ষের জন্য অপেক্ষা…<br><small id="rm"></small></div><video id="me" autoplay playsinline muted></video></div>
<div class="row" style="justify-content:center;margin:14px 0"><button class="btn o" id="mc">🎤 মাইক</button><button class="btn o" id="cm">📷 ক্যামেরা</button><button class="btn o" id="cp">🔗 লিংক কপি</button><button class="btn" onclick="location='dashboard.html'">❌ শেষ</button></div>
<p class="mu" style="text-align:center">দুটো ডিভাইসে একই লিংক খুললেই কল জুড়ে যাবে। এর জন্য <code>node server.js</code> চালু থাকতে হবে।</p></main>
<script src="js/app.js"></script><script>
const room=new URLSearchParams(location.search).get('room')||('r'+Math.random().toString(36).slice(2,7));history.replaceState(0,'','?room='+room);$('#rm').textContent='রুম: '+room;
const me=Math.random().toString(36).slice(2),pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}),q=[];let since=0,ready=0,st;
const send=d=>fetch('/api/sig/'+room,{method:'POST',body:JSON.stringify({from:me,data:d})});
const flush=()=>{while(q.length)pc.addIceCandidate(q.shift()).catch(()=>0)};
pc.ontrack=e=>{$('#you').srcObject=e.streams[0];$('#w').remove()};pc.onicecandidate=e=>e.candidate&&send({c:e.candidate});
(async()=>{if(location.protocol=='file:')return toast('node server.js চালিয়ে http://localhost:3000 থেকে খুলুন');
 try{st=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(e){return toast('ক্যামেরা/মাইকের অনুমতি দিন')}
 $('#me').srcObject=st;st.getTracks().forEach(t=>pc.addTrack(t,st));send({hi:1});setInterval(poll,800)})();
async function poll(){let r;try{r=await(await fetch('/api/sig/'+room+'?since='+since)).json()}catch(e){return}since=r.n;
 for(const m of r.m){const d=m.data;if(m.from==me){if(d.hi)ready=1;continue}
  if(d.hi&&ready){const o=await pc.createOffer();await pc.setLocalDescription(o);send({s:pc.localDescription})}
  else if(d.s){if(d.s.type=='offer'){await pc.setRemoteDescription(d.s);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);send({s:pc.localDescription})}else if(!pc.currentRemoteDescription){await pc.setRemoteDescription(d.s);flush()}}
  else if(d.c){pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>0):q.push(d.c)}}}
const tg=(b,k)=>$(b).onclick=()=>{if(!st)return;const t=st['get'+k+'Tracks']()[0];t.enabled=!t.enabled;$(b).style.opacity=t.enabled?1:.4};tg('#mc','Audio');tg('#cm','Video');
$('#cp').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>toast('লিংক কপি হয়েছে'))</script></body></html>
